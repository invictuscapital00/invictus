<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invictus | Login</title>
    <style>
        :root { --neon-green: #00ff88; --bg: #0a0a0a; --card: #161616; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: var(--card); padding: 40px; border-radius: 20px; border: 1px solid #222; width: 100%; max-width: 350px; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.7); }
        h2 { color: var(--neon-green); letter-spacing: 3px; margin-bottom: 25px; text-transform: uppercase; }
        .pass-container { position: relative; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 10px 0; background: #000; border: 1px solid #333; color: white; border-radius: 8px; box-sizing: border-box; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--neon-green); box-shadow: 0 0 10px rgba(0, 255, 136, 0.1); }
        .eye { position: absolute; right: 12px; top: 22px; cursor: pointer; color: var(--neon-green); font-size: 1.1rem; }
        button { width: 100%; padding: 14px; background: var(--neon-green); border: none; border-radius: 8px; font-weight: bold; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s; color: #000; margin-top: 10px; }
        button:hover { background: #00cc6e; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0, 255, 136, 0.3); }
        .links { margin-top: 20px; font-size: 0.85rem; color: #666; }
        .links a { color: var(--neon-green); text-decoration: none; }
    </style>
</head>
<body>
    <div class="box">
        <h2>INVICTUS LOGIN</h2>
        <input type="email" id="email" placeholder="Correo Electrónico">
        <div class="pass-container">
            <input type="password" id="password" placeholder="Contraseña">
            <span class="eye" onclick="togglePass()">👁️</span>
        </div>
        <button onclick="login()">ENTRAR AL PANEL</button>
        <div class="links">
            ¿No tienes cuenta? <a href="https://invictuscapital00.github.io/invictus/registro.html">Regístrate aquí</a>
        </div>
    </div>

    <script>
        const BASE_URL = 'https://invictuscapital00.github.io/invictus';

        function togglePass() {
            const p = document.getElementById('password');
            p.type = p.type === 'password' ? 'text' : 'password';
        }

        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if(!email || !password) return alert("Por favor, completa tus credenciales.");

            try {
                // Intentamos conectar con el backend real de Invictus
                const res = await fetch(`${BASE_URL}/api/login`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ email, password })
                });

                // Lógica de compatibilidad para GitHub Pages (Simulación)
                if (res.status === 404 || res.status === 405) {
                    console.warn("GitHub Pages detectado. Simulando acceso...");
                    // En pruebas, si usas admin@mail.com puedes entrar directo
                    simularLogin(email);
                    return;
                }

                if(res.ok) {
                    const data = await res.json();
                    localStorage.setItem('usuarioId', data.usuario.id);
                    localStorage.setItem('usuarioNombre', data.usuario.nombre);
                    location.href = `${BASE_URL}/index.html`;
                } else { 
                    alert("Error de acceso: Credenciales incorrectas."); 
                }
            } catch (err) {
                console.error("Error de conexión:", err);
                // Si estás en desarrollo sin servidor, permitimos entrar para ver el diseño
                simularLogin(email);
            }
        }

        function simularLogin(email) {
            localStorage.setItem('usuarioId', '999');
            localStorage.setItem('usuarioNombre', email.split('@')[0]);
            location.href = `${BASE_URL}/index.html`;
        }
    </script>
</body>
</html>
