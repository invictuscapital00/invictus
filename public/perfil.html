<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil | Invictus Capital</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0a0a0a; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .profile-card { background: #161616; padding: 40px; border-radius: 20px; border: 1px solid #222; width: 100%; max-width: 400px; text-align: center; }
        h2 { color: #00ff88; text-transform: uppercase; letter-spacing: 2px; }
        .info-box { background: #000; padding: 15px; border-radius: 10px; margin-bottom: 20px; text-align: left; border: 1px solid #333; }
        .info-label { font-size: 0.7rem; color: #666; text-transform: uppercase; }
        .info-value { font-size: 1rem; color: #fff; margin-top: 5px; display: block; }
        
        input { width: 100%; padding: 12px; margin-top: 10px; border-radius: 8px; border: 1px solid #333; background: #222; color: white; box-sizing: border-box; }
        .btn-update { background: #00ff88; color: black; border: none; padding: 15px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 20px; transition: 0.3s; }
        .btn-update:hover { background: #00cc6e; transform: translateY(-2px); }
        .back { display: block; margin-top: 20px; color: #666; text-decoration: none; font-size: 0.8rem; }
    </style>
</head>
<body>

<div class="profile-card">
    <h2>Mi Perfil</h2>
    
    <div class="info-box">
        <span class="info-label">Correo Electrónico</span>
        <span class="info-value" id="disp-email">cargando...</span>
    </div>

    <div style="text-align: left; margin-bottom: 10px;">
        <label class="info-label">Nombre de Socio</label>
        <input type="text" id="new-nombre" placeholder="Tu nombre">
    </div>

    <div style="text-align: left;">
        <label class="info-label">Nueva Contraseña</label>
        <input type="password" id="new-pass" placeholder="Dejar en blanco para no cambiar">
    </div>

    <button class="btn-update" onclick="actualizarPerfil()">Guardar Cambios</button>
    <a href="index.html" class="back">← Volver al Dashboard</a>
</div>

<script>
    const id = localStorage.getItem('usuarioId');

    window.onload = async () => {
        const res = await fetch(`http://invictuscapital00.github.io/invictus/api/.../usuarios`); // Usamos esta ruta para jalar info
        const usuarios = await res.json();
        const yo = usuarios.find(u => u._id === id);
        
        if(yo) {
            document.getElementById('disp-email').innerText = yo.email;
            document.getElementById('new-nombre').value = yo.nombre;
        }
    };

    async function actualizarPerfil() {
        const nombre = document.getElementById('new-nombre').value;
        const password = document.getElementById('new-pass').value;

        const res = await fetch(`http://invictuscapital00.github.io/invictus/api/.../actualizar/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ nombre, password: password || undefined })
        });

        if(res.ok) {
            const data = await res.json();
            localStorage.setItem('usuarioNombre', data.nombre);
            alert("¡Perfil actualizado! Se verá reflejado al recargar.");
            window.location.href = 'index.html';
        }
    }
</script>

</body>
</html>
