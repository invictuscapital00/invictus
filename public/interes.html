<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Proyectiva | Invictus</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0a0a0a; color: white; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .calc-card { background: #161616; padding: 30px; border-radius: 20px; border: 1px solid #00ff88; width: 100%; max-width: 500px; }
        
        h2 { color: #00ff88; text-transform: uppercase; text-align: center; letter-spacing: 2px; }
        .input-group { margin-bottom: 20px; }
        label { display: block; font-size: 0.8rem; color: #888; margin-bottom: 8px; }
        
        input { width: 100%; padding: 15px; border-radius: 10px; border: 1px solid #333; background: #000; color: #00ff88; font-size: 1.2rem; font-weight: bold; box-sizing: border-box; }
        
        .result-box { background: #00ff8811; border: 1px dashed #00ff88; padding: 20px; border-radius: 10px; margin-top: 20px; text-align: center; }
        .result-val { font-size: 2.5rem; color: #00ff88; font-weight: bold; display: block; }
        
        .table-proj { width: 100%; margin-top: 20px; border-collapse: collapse; font-size: 0.8rem; }
        .table-proj th { color: #444; text-align: left; padding: 10px; border-bottom: 1px solid #222; }
        .table-proj td { padding: 10px; border-bottom: 1px solid #111; }

        .btn-calc { width: 100%; padding: 15px; background: #00ff88; color: black; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-top: 10px; }
        .back { display: block; text-align: center; margin-top: 20px; color: #444; text-decoration: none; font-size: 0.8rem; }
    </style>
</head>
<body>

<div class="calc-card">
    <h2>Interés Compuesto</h2>
    <p style="text-align: center; color: #666; font-size: 0.8rem; margin-bottom: 30px;">Proyecta tu libertad financiera a 12 meses.</p>

    <div class="input-group">
        <label>Capital Inicial (USDT)</label>
        <input type="number" id="capital" value="1000" oninput="calcular()">
    </div>

    <div class="input-group">
        <label>Rendimiento Mensual Estimado (%)</label>
        <input type="number" id="tasa" value="10" oninput="calcular()">
    </div>

    <div class="result-box">
        <label style="color: #00ff88;">TOTAL ESTIMADO (12 MESES)</label>
        <span class="result-val" id="total-final">0.00</span>
        <small id="ganancia-neta" style="color: #888;"></small>
    </div>

    <table class="table-proj">
        <thead>
            <tr>
                <th>MES</th>
                <th>CAPITAL</th>
                <th>GANANCIA</th>
            </tr>
        </thead>
        <tbody id="tabla-cuerpo"></tbody>
    </table>

    <a href="index.html" class="back">← Volver al Dashboard</a>
</div>

<script>
    function calcular() {
        const capitalInicial = parseFloat(document.getElementById('capital').value) || 0;
        const tasaMensual = (parseFloat(document.getElementById('tasa').value) || 0) / 100;
        const tabla = document.getElementById('tabla-cuerpo');
        let capitalAcumulado = capitalInicial;

        tabla.innerHTML = "";

        for (let i = 1; i <= 12; i++) {
            let gananciaMes = capitalAcumulado * tasaMensual;
            capitalAcumulado += gananciaMes;

            if (i <= 5 || i === 12) { // Mostrar primeros meses y el final
                tabla.innerHTML += `
                    <tr>
                        <td>Mes ${i}</td>
                        <td>${capitalAcumulado.toFixed(2)}</td>
                        <td style="color: #00ff88;">+${gananciaMes.toFixed(2)}</td>
                    </tr>
                `;
            } else if (i === 6) {
                tabla.innerHTML += `<tr><td colspan="3" style="text-align:center; color:#333">...</td></tr>`;
            }
        }

        document.getElementById('total-final').innerText = capitalAcumulado.toFixed(2);
        document.getElementById('ganancia-neta').innerText = `Ganancia neta: ${(capitalAcumulado - capitalInicial).toFixed(2)} USDT`;
    }

    // Ejecutar al cargar
    window.onload = calcular;
</script>

</body>
</html>
