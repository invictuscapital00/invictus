<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retiros | Invictus Capital</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0a0a0a; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .withdraw-card { background: #161616; padding: 35px; border-radius: 20px; border: 1px solid #ff4d4d; width: 100%; max-width: 450px; }
        h2 { color: #ff4d4d; text-transform: uppercase; letter-spacing: 2px; text-align: center; }
        .warning { background: #ff4d4d22; border: 1px solid #ff4d4d; padding: 15px; border-radius: 8px; font-size: 0.8rem; color: #ff4d4d; margin-bottom: 20px; text-align: center; }
        
        label { display: block; font-size: 0.8rem; color: #888; margin-bottom: 5px; }
        input { width: 100%; padding: 12px; margin-bottom: 20px; border-radius: 8px; border: 1px solid #333; background: #000; color: white; box-sizing: border-box; }
        
        .btn-withdraw { background: #ff4d4d; color: white; border: none; padding: 15px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; text-transform: uppercase; transition: 0.3s; }
        .btn-withdraw:hover { background: #cc0000; box-shadow: 0 0 20px rgba(255, 77, 77, 0.4); }
        .back { display: block; text-align: center; margin-top: 20px; color: #666; text-decoration: none; font-size: 0.8rem; }
    </style>
</head>
<body>

<div class="withdraw-card">
    <h2>Solicitar Retiro</h2>
    <div class="warning">
        ⚠️ Asegúrate de que tu billetera sea <strong>TRC20 (Tether USDT)</strong>. Invictus Capital no se hace responsable por errores de dirección.
    </div>

    <label>Monto a Retirar (USDT)</label>
    <input type="number" id="monto-retiro" placeholder="Ej: 100.00">

    <label>Tu Billetera USDT (TRC20)</label>
    <input type="text" id="billetera-destino" placeholder="Txxxxxxxxxxxxxxxxxxxxxxxxxxxx">

    <button class="btn-withdraw" onclick="procesarRetiro()">Enviar Solicitud</button>
    <a href="index.html" class="back">← Cancelar y Volver</a>
</div>

<script>
    async function procesarRetiro() {
        const id = localStorage.getItem('usuarioId');
        const monto = document.getElementById('monto-retiro').value;
        const billetera = document.getElementById('billetera-destino').value;

        if(!monto || !billetera) return alert("Por favor, completa todos los campos.");

        const res = await fetch('http://invictuscapital00.github.io/invictus/api/retiro', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ usuarioId: id, monto, billetera })
        });

        const data = await res.json();

        if (res.ok) {
            alert("✅ Solicitud enviada con éxito. El administrador procesará tu pago.");
            window.location.href = 'index.html';
        } else {
            alert("❌ Error: " + data.error);
        }
    }
</script>

</body>
</html>
