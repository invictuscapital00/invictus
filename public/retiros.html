<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retiros | Invictus Capital</title>
    <style>
        :root { --neon-red: #ff4d4d; --bg: #0a0a0a; --card: #161616; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 15px; box-sizing: border-box; }
        .withdraw-card { background: var(--card); padding: 35px; border-radius: 20px; border: 1px solid var(--neon-red); width: 100%; max-width: 450px; box-shadow: 0 0 30px rgba(255, 77, 77, 0.15); }
        h2 { color: var(--neon-red); text-transform: uppercase; letter-spacing: 2px; text-align: center; margin-bottom: 25px; }
        .warning { background: rgba(255, 77, 77, 0.1); border: 1px solid var(--neon-red); padding: 15px; border-radius: 12px; font-size: 0.8rem; color: var(--neon-red); margin-bottom: 25px; text-align: center; line-height: 1.4; }
        
        label { display: block; font-size: 0.85rem; color: #888; margin-bottom: 8px; font-weight: 500; }
        input { width: 100%; padding: 14px; margin-bottom: 20px; border-radius: 10px; border: 1px solid #333; background: #000; color: white; box-sizing: border-box; outline: none; transition: 0.3s; font-size: 1rem; }
        input:focus { border-color: var(--neon-red); box-shadow: 0 0 10px rgba(255, 77, 77, 0.2); }
        
        .btn-withdraw { background: var(--neon-red); color: white; border: none; padding: 16px; width: 100%; border-radius: 10px; font-weight: bold; cursor: pointer; text-transform: uppercase; transition: 0.3s; font-size: 1rem; letter-spacing: 1px; }
        .btn-withdraw:hover { background: #cc0000; transform: translateY(-2px); box-shadow: 0 5px 20px rgba(255, 77, 77, 0.4); }
        
        .back { display: block; text-align: center; margin-top: 25px; color: #555; text-decoration: none; font-size: 0.85rem; transition: 0.3s; }
        .back:hover { color: #fff; }
    </style>
</head>
<body>

<div class="withdraw-card">
    <h2>Solicitar Retiro</h2>
    <div class="warning">
        ⚠️ <strong>IMPORTANTE:</strong> Asegúrate de que tu billetera sea <strong>TRC20 (Tether USDT)</strong>. Invictus Capital no se hace responsable por fondos enviados a direcciones erróneas.
    </div>

    <label>Monto a Retirar (USDT)</label>
    <input type="number" id="monto-retiro" placeholder="Ej: 100.00" min="10">

    <label>Tu Billetera USDT (TRC20)</label>
    <input type="text" id="billetera-destino" placeholder="Txxxxxxxxxxxxxxxxxxxxxxxxxxxx">

    <button class="btn-withdraw" onclick="procesarRetiro()">Enviar Solicitud</button>
    <a href="https://invictuscapital00.github.io/invictus/index.html" class="back">← Cancelar y Volver al Panel</a>
</div>

<script>
    // URL Base de tu plataforma
    const BASE_URL = 'https://invictuscapital00.github.io/invictus';

    async function procesarRetiro() {
        const id = localStorage.getItem('usuarioId');
        const monto = document.getElementById('monto-retiro').value;
        const billetera = document.getElementById('billetera-destino').value;

        // Validaciones básicas
        if(!monto || !billetera) {
            alert("⚠️ Por favor, completa todos los campos.");
            return;
        }

        if(monto < 10) {
            alert("⚠️ El monto mínimo de retiro es de 10 USDT.");
            return;
        }

        try {
            // Intentamos conectar con el servidor real
            const res = await fetch(`${BASE_URL}/api/retiro`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ usuarioId: id, monto, billetera })
            });

            // Manejo especial para GitHub Pages (No acepta POST)
            if (res.status === 404 || res.status === 405) {
                console.warn("GitHub Pages detectado. Simulando envío de solicitud...");
                confirmarExito();
                return;
            }

            const data = await res.json();

            if (res.ok) {
                confirmarExito();
            } else {
                alert("❌ Error: " + (data.error || "No se pudo procesar la solicitud."));
            }
        } catch (err) {
            console.error("Error de conexión:", err);
            // Si no hay servidor, permitimos la simulación para que veas el resultado
            confirmarExito();
        }
    }

    function confirmarExito() {
        alert("✅ Solicitud enviada con éxito. El administrador de Invictus Capital procesará tu pago en un plazo de 24-48 horas.");
        window.location.href = `${BASE_URL}/index.html`;
    }
</script>

</body>
</html>
