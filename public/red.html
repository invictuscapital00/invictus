<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Red | Invictus Capital</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0a0a0a; color: white; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; }
        
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #00ff88; padding-bottom: 15px; margin-bottom: 30px; }
        h1 { margin: 0; font-size: 1.5rem; text-transform: uppercase; letter-spacing: 2px; }
        
        .stats-red { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 30px; }
        .stat-card { background: #161616; padding: 20px; border-radius: 12px; border: 1px solid #222; text-align: center; }
        .stat-number { display: block; font-size: 2rem; color: #00ff88; font-weight: bold; }
        .stat-label { font-size: 0.75rem; color: #888; text-transform: uppercase; }

        table { width: 100%; border-collapse: collapse; background: #161616; border-radius: 12px; overflow: hidden; border: 1px solid #222; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #222; }
        th { background: #00ff88; color: #000; font-size: 0.8rem; text-transform: uppercase; }
        tr:hover { background: #1a1a1a; }
        
        .back-link { color: #888; text-decoration: none; font-size: 0.9rem; margin-bottom: 20px; display: inline-block; }
        .back-link:hover { color: #00ff88; }
        
        .empty-msg { text-align: center; padding: 40px; color: #444; }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="back-link">← Volver al Dashboard</a>
    
    <div class="header">
        <h1>Mi Linaje <span style="color: #00ff88;">Invictus</span></h1>
    </div>

    <div class="stats-red">
        <div class="stat-card">
            <span class="stat-number" id="total-socios">0</span>
            <span class="stat-label">Socios Directos</span>
        </div>
        <div class="stat-card">
            <span class="stat-number" id="capital-red">0.00</span>
            <span class="stat-label">Capital en Red (USDT)</span>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th>Socio</th>
                <th>Fecha de Ingreso</th>
                <th>Inversión</th>
            </tr>
        </thead>
        <tbody id="tabla-red">
            </tbody>
    </table>
    <div id="mensaje-vacio" class="empty-msg" style="display: none;">
        Aún no tienes socios en tu red. ¡Comparte tu enlace para ganar el 10%!
    </div>
</div>

<script>
    window.onload = async () => {
        const nombreUsuario = localStorage.getItem('usuarioNombre');
        if (!nombreUsuario) return window.location.href = 'login.html';

        try {
            const res = await fetch(`http://invictuscapital00.github.io/invictus/api/red/${nombreUsuario}`);
            const socios = await res.json();
            
            const tabla = document.getElementById('tabla-red');
            const totalSocios = document.getElementById('total-socios');
            const capitalRed = document.getElementById('capital-red');
            
            totalSocios.innerText = socios.length;
            
            if (socios.length === 0) {
                document.getElementById('mensaje-vacio').style.display = 'block';
                return;
            }

            let sumaCapital = 0;
            socios.forEach(s => {
                sumaCapital += s.balance_usdt;
                const fecha = new Date(s.fechaRegistro).toLocaleDateString();
                tabla.innerHTML += `
                    <tr>
                        <td><strong>${s.nombre}</strong></td>
                        <td style="color: #888;">${fecha}</td>
                        <td style="color: #00ff88;">${s.balance_usdt.toFixed(2)} USDT</td>
                    </tr>
                `;
            });
            
            capitalRed.innerText = sumaCapital.toFixed(2);

        } catch (err) {
            console.error("Error cargando la red.");
        }
    };
</script>

</body>
</html>
