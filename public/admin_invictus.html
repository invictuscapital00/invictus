<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel | Invictus Capital</title>
    <style>
        :root { --neon-green: #00ff88; --neon-blue: #00d2ff; --bg: #0a0a0a; --card: #161616; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: auto; }
        
        h1 { color: var(--neon-green); letter-spacing: 2px; text-align: center; border-bottom: 2px solid #222; padding-bottom: 10px; }

        /* Estadísticas Rápidas */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--card); padding: 20px; border-radius: 15px; border-left: 5px solid var(--neon-green); text-align: center; }
        .stat-val { font-size: 1.8rem; font-weight: bold; display: block; }

        /* Tabla de Usuarios */
        .section-card { background: var(--card); border-radius: 15px; padding: 20px; border: 1px solid #222; margin-bottom: 30px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.9rem; }
        th { text-align: left; color: #555; padding: 10px; border-bottom: 1px solid #333; }
        td { padding: 12px; border-bottom: 1px solid #222; }
        
        .btn-action { background: var(--neon-green); color: black; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-action:hover { transform: scale(1.05); box-shadow: 0 0 10px var(--neon-green); }

        /* Visualizador de Árbol (Red) */
        .tree-container { background: #000; padding: 20px; border-radius: 15px; min-height: 300px; overflow-x: auto; }
        .node { 
            display: inline-block; padding: 10px 20px; background: #222; border: 1px solid var(--neon-blue); 
            border-radius: 10px; margin: 10px; text-align: center; min-width: 120px;
        }
        .node b { color: var(--neon-blue); display: block; }
        .node small { color: #888; }
        .connector { color: #444; font-size: 1.5rem; }

        input { background: #000; border: 1px solid #333; color: white; padding: 8px; border-radius: 5px; width: 100px; }
    </style>
</head>
<body>

<div class="container">
    <h1>INVICTUS ADMIN <span style="color: #fff;">COMMAND</span></h1>

    <div class="stats-grid">
        <div class="stat-card"><small>TOTAL SOCIOS</small><span class="stat-val" id="total-users">0</span></div>
        <div class="stat-card" style="border-color: var(--neon-blue);"><small>CAPITAL TOTAL</small><span class="stat-val" id="total-capital">0.00</span></div>
    </div>

    <div class="section-card">
        <h3>Gestión de Usuarios y Carga de Saldo</h3>
        <table id="user-table">
            <thead>
                <tr>
                    <th>Socio</th>
                    <th>Email</th>
                    <th>Estado</th>
                    <th>Balance</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody id="user-list"></tbody>
        </table>
    </div>

    <div class="section-card">
        <h3>Visualizador de Red (Árbol Genealógico)</h3>
        <p style="font-size: 0.8rem; color: #666;">Haz clic en un socio arriba para desplegar su equipo abajo.</p>
        <div id="tree-display" class="tree-container">
            <div style="color: #333; text-align: center; margin-top: 50px;">Selecciona un líder para ver su red...</div>
        </div>
    </div>
</div>

<script>
    window.onload = cargarUsuarios;

    async function cargarUsuarios() {
        const res = await fetch('http://invictuscapital00.github.io/invictus/api/.../usuarios');
        const users = await res.json();
        const list = document.getElementById('user-list');
        let totalCap = 0;

        document.getElementById('total-users').innerText = users.length;
        list.innerHTML = "";

        users.forEach(u => {
            totalCap += u.balance_usdt;
            list.innerHTML += `
                <tr>
                    <td onclick="verRed('${u.nombre}')" style="cursor:pointer; color:var(--neon-blue)"><strong>${u.nombre}</strong> 👁️</td>
                    <td>${u.email}</td>
                    <td>${u.verificado ? '✅ Activo' : '❌ Pendiente'}</td>
                    <td>$${u.balance_usdt.toFixed(2)}</td>
                    <td>
                        <input type="number" id="monto-${u._id}" placeholder="USDT">
                        <button class="btn-action" onclick="cargarSaldo('${u._id}')">Cargar</button>
                    </td>
                </tr>
            `;
        });
        document.getElementById('total-capital').innerText = totalCap.toFixed(2);
    }

    async function cargarSaldo(id) {
        const monto = document.getElementById(`monto-${id}`).value;
        if(!monto) return alert("Ingresa un monto");

        const res = await fetch('http://invictuscapital00.github.io/invictus/api/.../actualizar-saldo', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ usuarioId: id, nuevoMonto: monto })
        });

        if(res.ok) {
            alert("Capital cargado y bonos de red pagados.");
            cargarUsuarios();
        }
    }

    async function verRed(nombreLider) {
        const res = await fetch(`http://invictuscapital00.github.io/invictus/api/.../${nombreLider}`);
        const invitados = await res.json();
        const display = document.getElementById('tree-display');

        display.innerHTML = `
            <div style="text-align:center">
                <div class="node" style="border-color:var(--neon-green)">
                    <b>${nombreLider}</b>
                    <small>LÍDER DE EQUIPO</small>
                </div>
                <div class="connector">⬇️</div>
                <div id="sub-nodes"></div>
            </div>
        `;

        const subNodes = document.getElementById('sub-nodes');
        if(invitados.length === 0) {
            subNodes.innerHTML = "<p style='color:#444'>Este socio aún no tiene invitados directos.</p>";
            return;
        }

        invitados.forEach(inv => {
            subNodes.innerHTML += `
                <div class="node">
                    <b>${inv.nombre}</b>
                    <small>$${inv.balance_usdt.toFixed(2)} USDT</small>
                </div>
            `;
        });
    }
</script>

</body>
</html>
