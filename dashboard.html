<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recompensas | Invictus Capital</title>
    <style>
        :root { --neon-green: #00ff88; --bg: #0a0a0a; --card: #161616; --text-muted: #64748b; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: var(--card);
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
            text-align: center;
            border: 1px solid #222;
            width: 90%;
            max-width: 380px;
        }
        .user-info h2 { color: var(--neon-green); margin-bottom: 0.5rem; font-size: 1.2rem; text-transform: uppercase; letter-spacing: 1px; }
        .user-info p { color: var(--text-muted); margin: 0; font-size: 0.9rem; }
        h1 { font-size: 2.8rem; color: white; margin: 1rem 0; font-family: 'Courier New', monospace; }
        
        .btn-principal {
            background-color: var(--neon-green);
            color: black;
            border: none;
            padding: 1.2rem;
            border-radius: 12px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            margin-top: 10px;
            text-transform: uppercase;
        }
        .btn-principal:hover { background-color: #00cc6e; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0, 255, 136, 0.3); }
        
        .btn-logout {
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            margin-top: 25px;
            text-decoration: none;
            font-size: 0.85rem;
            opacity: 0.7;
        }
        .btn-logout:hover { opacity: 1; text-decoration: underline; }
        
        .ref-box {
            margin-top: 1.5rem;
            padding: 12px;
            background: #000;
            border-radius: 10px;
            font-size: 0.8rem;
            color: var(--neon-green);
            border: 1px dashed #333;
        }

        .back-link {
            display: block;
            margin-top: 15px;
            color: #444;
            text-decoration: none;
            font-size: 0.8rem;
        }
        .back-link:hover { color: var(--neon-green); }
    </style>
</head>
<body>

    <div class="card">
        <div class="user-info">
            <h2 id="nombre-usuario">Verificando...</h2>
            <p>Recompensa Acumulada</p>
            <h1 id="saldo-display">0.00 USDT</h1>
        </div>

        <button class="btn-principal" id="btn-reclamar">RECOGER GANANCIA DIARIA</button>
        
        <div class="ref-box">
            Código de Socio: <span id="mi-codigo" style="font-weight: bold; color: white;">---</span>
        </div>

        <a href="https://invictuscapital00.github.io/invictus/index.html" class="back-link">Volver al Panel Principal</a>
        <button class="btn-logout" onclick="cerrarSesion()">Cerrar sesión segura</button>
    </div>

    <script>
        const BASE_URL = 'https://invictuscapital00.github.io/invictus';
        const usuarioId = localStorage.getItem('usuarioId');
        const usuarioNombre = localStorage.getItem('usuarioNombre');

        // Redirigir si no hay sesión
        if (!usuarioId) {
            window.location.href = `${BASE_URL}/login.html`;
        }

        async function actualizarPantalla() {
            try {
                // En GitHub Pages leemos el JSON estático
                const respuesta = await fetch(`${BASE_URL}/usuarios.json`);
                const usuarios = await respuesta.json();
                
                // Buscamos al usuario actual
                const datos = usuarios.find(u => u._id === usuarioId || u.nombre === usuarioNombre);
                
                if (datos) {
                    document.getElementById('nombre-usuario').innerText = `Hola, ${datos.nombre}`;
                    document.getElementById('saldo-display').innerText = `${parseFloat(datos.balance_usdt || 0).toFixed(2)} USDT`;
                    document.getElementById('mi-codigo').innerText = datos.nombre.toUpperCase(); // Usamos el nombre como código
                } else {
                    // Modo offline/Simulación si no está en el JSON
                    document.getElementById('nombre-usuario').innerText = `Hola, ${usuarioNombre}`;
                    document.getElementById('mi-codigo').innerText = usuarioNombre.toUpperCase();
                }
            } catch (error) {
                console.error("Modo simulación activo");
                document.getElementById('nombre-usuario').innerText = `Hola, ${usuarioNombre}`;
            }
        }

        document.getElementById('btn-reclamar').onclick = async () => {
            // Simulamos la recogida de ganancia
            const btn = document.getElementById('btn-reclamar');
            btn.innerText = "PROCESANDO...";
            btn.disabled = true;

            setTimeout(() => {
                alert("✅ ¡Ganancia recogida con éxito! Se acreditará a tu balance en el próximo corte del algoritmo.");
                btn.innerText = "RECOGER GANANCIA DIARIA";
                btn.disabled = false;
            }, 1500);
        };

        function cerrarSesion() {
            localStorage.clear();
            window.location.href = `${BASE_URL}/login.html`;
        }

        actualizarPantalla();
    </script>
</body>
</html>
