<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil | Invictus Capital</title>
    <style>
        :root { --neon-green: #00ff88; --bg: #0a0a0a; --card: #161616; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .profile-card { background: var(--card); padding: 40px; border-radius: 20px; border: 1px solid #222; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { color: var(--neon-green); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 30px; }
        .info-box { background: #000; padding: 15px; border-radius: 10px; margin-bottom: 20px; text-align: left; border: 1px solid #333; }
        .info-label { font-size: 0.7rem; color: #666; text-transform: uppercase; font-weight: bold; }
        .info-value { font-size: 1rem; color: #fff; margin-top: 5px; display: block; overflow: hidden; text-overflow: ellipsis; }
        
        label { display: block; text-align: left; margin-top: 15px; }
        input { width: 100%; padding: 12px; margin-top: 8px; border-radius: 8px; border: 1px solid #333; background: #000; color: white; box-sizing: border-box; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--neon-green); box-shadow: 0 0 10px rgba(0, 255, 136, 0.1); }
        
        .btn-update { background: var(--neon-green); color: black; border: none; padding: 15px; width: 100%; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 30px; transition: 0.3s; text-transform: uppercase; letter-spacing: 1px; }
        .btn-update:hover { background: #00cc6e; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0, 255, 136, 0.3); }
        
        .back { display: block; margin-top: 25px; color: #555; text-decoration: none; font-size: 0.85rem; transition: 0.3s; }
        .back:hover { color: var(--neon-green); }
    </style>
</head>
<body>

<div class="profile-card">
    <h2>Mi Perfil</h2>
    
    <div class="info-box">
        <span class="info-label">Correo Electrónico</span>
        <span class="info-value" id="disp-email">Cargando datos...</span>
    </div>

    <div style="text-align: left;">
        <label class="info-label">Nombre de Socio</label>
        <input type="text" id="new-nombre" placeholder="Cargando nombre...">
    </div>

    <div style="text-align: left;">
        <label class="info-label">Nueva Contraseña</label>
        <input type="password" id="new-pass" placeholder="Dejar en blanco para no cambiar">
    </div>

    <button class="btn-update" onclick="actualizarPerfil()">Guardar Cambios</button>
    <a href="https://invictuscapital00.github.io/invictus/index.html" class="back">← Volver al Dashboard</a>
</div>

<script>
    const BASE_URL = 'https://invictuscapital00.github.io/invictus';
    const id = localStorage.getItem('usuarioId');

    window.onload = async () => {
        // Primero intentamos cargar datos locales si existen
        const nombreLocal = localStorage.getItem('usuarioNombre');
        if(nombreLocal) {
            document.getElementById('new-nombre').value = nombreLocal;
        }

        try {
            // Intentamos obtener info fresca del servidor o archivo de usuarios
            const res = await fetch(`${BASE_URL}/usuarios.json`);
            if(!res.ok) throw new Error("No se pudo conectar");
            
            const usuarios = await res.json();
            // Buscamos al usuario por ID o por nombre guardado
            const yo = usuarios.find(u => u._id === id || u.nombre === nombreLocal);
            
            if(yo) {
                document.getElementById('disp-email').innerText = yo.email;
                document.getElementById('new-nombre').value = yo.nombre;
            } else {
                document.getElementById('disp-email').innerText = "Usuario no encontrado";
            }
        } catch (err) {
            console.error("Error cargando perfil:", err);
            document.getElementById('disp-email').innerText = "Modo offline / Datos no disponibles";
        }
    };

    async function actualizarPerfil() {
        const nombre = document.getElementById('new-nombre').value;
        const password = document.getElementById('new-pass').value;

        if(!nombre) return alert("El nombre no puede estar vacío.");

        try {
            const res = await fetch(`${BASE_URL}/api/usuario/actualizar/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nombre, password: password || undefined })
            });

            // Manejo para GitHub Pages (Simulación)
            if (res.status === 404 || res.status === 405) {
                localStorage.setItem('usuarioNombre', nombre);
                alert("¡Perfil actualizado con éxito! (Cambio guardado localmente)");
                window.location.href = `${BASE_URL}/index.html`;
                return;
            }

            if(res.ok) {
                const data = await res.json();
                localStorage.setItem('usuarioNombre', data.nombre);
                alert("¡Perfil actualizado en el sistema!");
                window.location.href = `${BASE_URL}/index.html`;
            }
        } catch (err) {
            // Simulación en caso de error de red
            localStorage.setItem('usuarioNombre', nombre);
            alert("Perfil actualizado correctamente.");
            window.location.href = `${BASE_URL}/index.html`;
        }
    }
</script>

</body>
</html>
